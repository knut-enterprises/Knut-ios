# Knut iPhone app: builds this repo on a GitHub Mac, signs it with Apple's
# cloud-managed signing and uploads it to App Store Connect (TestFlight).
# The App Store Connect API key is fetched from knut.com.au, which hands it
# only to this workflow on main after checking GitHub's signed identity token.
name: Knut iPhone app
# Started by hand or by auto-build.yml. This repo is public, so GitHub Mac minutes are free here; don't copy this workflow into a private repo,
# where they bill at 10x. See BUILDS.md.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        default: knut
        options: [knut, viba]
      runner:
        description: Mac to build on (use macos-15-intel when macos-latest has no capacity)
        type: choice
        default: macos-latest
        options: [macos-latest, macos-15-intel]
      task:
        description: What to do
        type: choice
        default: build
        options: [build, listing, submit, swap, status]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ios-app
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.task != 'listing' && inputs.task != 'submit' && inputs.task != 'swap' && inputs.task != 'status' }}
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    env:
      TEAM_ID: 5AUSX9646V
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick the app
        run: |
          if [ "${{ inputs.app }}" = "viba" ]; then
            { echo "APP_DIR=viba"; echo "BUNDLE_ID=guru.viba.app"; echo "APP_NAME=VIBA"; } >> "$GITHUB_ENV"
          else
            { echo "APP_DIR=."; echo "BUNDLE_ID=au.com.knut.app"; echo "APP_NAME=Knut"; } >> "$GITHUB_ENV"
          fi
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Get the App Store Connect key from knut.com.au
        run: |
          # The website deploys from the same push, so wait for it (up to 25 min).
          for i in $(seq 1 50); do
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=knut-ios-build" | jq -r .value)
            CODE=$(curl -sS -o creds.json -w '%{http_code}' -X POST -H "Authorization: Bearer $OIDC" https://knut.com.au/api/internal/ios-build-credentials || true)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE"; rm -f creds.json; sleep 30
          done
          [ -s creds.json ] || { echo "Could not get the App Store Connect key"; exit 1; }
          KEY_ID=$(jq -r .keyId creds.json); ISSUER=$(jq -r .issuerId creds.json)
          mkdir -p "$HOME/private_keys"
          jq -r .p8 creds.json > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          PASS=$(jq -r .cachePassphrase creds.json); echo "::add-mask::$PASS"; echo "CACHE_PASSPHRASE=$PASS" >> "$GITHUB_ENV"
          rm creds.json
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Restore the encrypted signing certificate
        uses: actions/cache/restore@v4
        with:
          path: ~/.knut-signing
          key: signing-v1-miss-${{ github.run_id }}
          restore-keys: signing-v1-
      - name: Create the distribution certificate and profile
        run: node scripts/asc-sign.mjs
      - name: Keep the encrypted signing certificate
        uses: actions/cache/save@v4
        with:
          path: ~/.knut-signing
          key: signing-v1-${{ github.run_id }}
      - name: Install the app shell
        working-directory: ${{ env.APP_DIR }}
        run: npm ci && npx cap sync ios
      - name: Archive
        working-directory: ${{ env.APP_DIR }}/ios/App
        shell: bash
        run: |
          # Manual signing for the App target only (the Pods keep their own settings).
          sed -i '' -e "s|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"$SIGN_IDENTITY\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";|" App.xcodeproj/project.pbxproj
          set -o pipefail
          xcodebuild -quiet -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Knut.xcarchive" \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 1)) \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              grep -E "error:|Error Domain|No (account|profile|signing)|requires|failed" "$RUNNER_TEMP/archive.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
              exit 1
            }
      - name: Sign and upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Knut.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -v '^\s*$' "$RUNNER_TEMP/export.log" | tail -14 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
              exit 1
            }
          grep -iE "upload|deliver|transporter|succeeded|bundle|version|build" "$RUNNER_TEMP/export.log" | sort -u | head -12 | while IFS= read -r l; do echo "::notice::${l:0:300}"; done
          ls -la "$RUNNER_TEMP/export" | while IFS= read -r l; do echo "::notice::${l}"; done
      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "::notice::Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log" || {
            grep -v '^$' "$RUNNER_TEMP/upload.log" | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
          grep -v '^$' "$RUNNER_TEMP/upload.log" | tail -8 | while IFS= read -r l; do echo "::notice::${l:0:300}"; done
      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"

  listing:
    if: ${{ inputs.task == 'listing' || inputs.task == 'submit' || inputs.task == 'swap' || inputs.task == 'status' }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick the app
        run: |
          if [ "${{ inputs.app }}" = "viba" ]; then echo "APP_DIR=viba" >> "$GITHUB_ENV"; else echo "APP_DIR=." >> "$GITHUB_ENV"; fi
      - name: Get the App Store Connect key from knut.com.au
        run: |
          # The website deploys from the same push, so wait for it (up to 25 min).
          for i in $(seq 1 50); do
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=knut-ios-build" | jq -r .value)
            CODE=$(curl -sS -o creds.json -w '%{http_code}' -X POST -H "Authorization: Bearer $OIDC" https://knut.com.au/api/internal/ios-build-credentials || true)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE"; rm -f creds.json; sleep 30
          done
          [ -s creds.json ] || { echo "Could not get the App Store Connect key"; exit 1; }
          KEY_ID=$(jq -r .keyId creds.json); ISSUER=$(jq -r .issuerId creds.json)
          mkdir -p "$HOME/private_keys"
          jq -r .p8 creds.json > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          rm creds.json
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Take the screenshots
        if: ${{ inputs.task != 'swap' && inputs.task != 'status' }}
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/shots.mjs "$APP_DIR"
      - name: Publish screenshots for the Play Console
        if: ${{ inputs.task != 'swap' && inputs.task != 'status' }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets" && cp -r shots shots-play "$RUNNER_TEMP/assets/" && cp -r "$APP_DIR/play" "$RUNNER_TEMP/assets/" 2>/dev/null || true
          cd "$RUNNER_TEMP/assets" && git init -q -b assets && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets
      - name: Swap the build into review
        if: ${{ inputs.task == 'swap' || inputs.task == 'status' }}
        run: |
          if [ "${{ inputs.app }}" = "viba" ]; then export BUNDLE_ID=guru.viba.app; else export BUNDLE_ID=au.com.knut.app; fi
          if [ "${{ inputs.task }}" = "status" ]; then export MODE=status; fi
          node scripts/asc-swap.mjs
      - name: Fill in the listing
        if: ${{ inputs.task != 'swap' && inputs.task != 'status' }}
        env:
          SUBMIT: ${{ inputs.task == 'submit' && '1' || '0' }}
        run: node scripts/asc-listing.mjs
